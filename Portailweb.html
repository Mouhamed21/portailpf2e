<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail WEB DU PF2E</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1>PORTAIL WEB DU PF2E</h1>
        </div>
        <div class="title-area">
            <h2>Programme de Formation Ecole Entreprise</h2>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="grid-cards">
            
            <a href="#" class="card" style="--delay: 0.1s;">
                <i class="fa-solid fa-house card-icon"></i>
                <span class="card-title">SIPF2E</span>
            </a>

            <a href="#" class="card" style="--delay: 0.2s;">
                <i class="fa-solid fa-inbox card-icon"></i>
                <span class="card-title">Actualités</span>
            </a>

            <a href="#" class="card" style="--delay: 0.3s;">
                <i class="fa-solid fa-users card-icon"></i>
                <span class="card-title">RH</span>
            </a>

            <a href="#" class="card" style="--delay: 0.4s;">
                <i class="fa-solid fa-layer-group card-icon"></i>
                <span class="card-title">Site web</span>
            </a>

            <a href="#" class="card" style="--delay: 0.5s;">
                <i class="fa-regular fa-envelope card-icon"></i>
                <span class="card-title">Courriel professionnel</span>
            </a>

            <a href="#" class="card" style="--delay: 0.6s;">
                <i class="fa-solid fa-chart-simple card-icon"></i>
                <span class="card-title">Compta Matière</span>
            </a>

            <a href="#" class="card" style="--delay: 0.7s;">
                <i class="fa-solid fa-user-gear card-icon"></i>
                <span class="card-title">BASE PF2E</span>
            </a>

            <a href="#" class="card" style="--delay: 0.8s;">
                <i class="fa-solid fa-key card-icon"></i>
                <span class="card-title">Mot de passe Mail pro</span>
            </a>

        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <i class="fa-solid fa-seedling"></i>
            <span>Par PF2E 2025</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
