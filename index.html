<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail WEB DU PF2E</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="512x512" href="logo-pf2e-512-V2.png">
    <link rel="apple-touch-icon" href="logo-pf2e-512-V2.png">
    <link rel="icon" type="image/png" href="logo-PF2E.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <div class="logo-area">
            <img src="logo-PF2E.png"  onclick="window.location.reload();" alt="Logo PF2E" class="pf2e-logo">
            <h1>PORTAIL WEB DU PF2E</h1>
        </div>
        
        <div class="title-area" style="display: flex; align-items: center; justify-content: flex-end;">
            <h2>Programme de Formation Ecole Entreprise</h2>
            
        </div>
    </header>

    <main class="dashboard-container">
        <div class="grid-cards">
            
            <a href="https://ecoleentreprise.sec.gouv.sn/" target="_blank" class="card" style="--delay: 0.1s;">
                <i class="fa-solid fa-house card-icon"></i>
                <span class="card-title">SIPF2E</span>
            </a>

            <a href="https://ecoleentreprise.sec.gouv.sn/actualites" target="_blank" class="card" style="--delay: 0.2s;">
                <i class="fa-solid fa-inbox card-icon"></i>
                <span class="card-title">Actualités</span>
            </a>

            <a href="https://pf2e.taktyl.io/" target="_blank"  class="card" style="--delay: 0.3s;">
                <i class="fa-solid fa-users card-icon"></i>
                <span class="card-title">RH</span>
            </a>

            <a href="https://pf2e.sn/" target="_blank" class="card" style="--delay: 0.4s;">
                <i class="fa-solid fa-layer-group card-icon"></i>
                <span class="card-title">Site web</span>
            </a>

            <a href="https://pf2e.sn/mail/" target="_blank" class="card" style="--delay: 0.5s;">
                <i class="fa-regular fa-envelope card-icon"></i>
                <span class="card-title">Courriel professionnel</span>
            </a>

            <a href="https://pf2e.taktyl.io" target="_blank" class="card" style="--delay: 0.6s;">
                <i class="fa-solid fa-chart-simple card-icon"></i>
                <span class="card-title">Compta Matière</span>
            </a>

            <a href="https://pf2e.sn/basepf2e/" target="_blank" class="card" style="--delay: 0.7s;">
                <i class="fa-solid fa-user-gear card-icon"></i>
                <span class="card-title">BASE PF2E</span>
            </a>

            <a href="https://pf2e.sn/webmail/" target="_blank" class="card" style="--delay: 0.8s;">
                <i class="fa-solid fa-key card-icon"></i>
                <span class="card-title">Mot de passe Mail pro</span>
            </a>

        </div>
    </main>

    <footer class="footer">
    <div class="footer-content">
                <img src="logo-PF2E.png" alt="Logo PF2E" class="pf2e-logo-footer">
                <span>Par PF2E 2025</span>
            </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
